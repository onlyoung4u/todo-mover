# SPEC 15.5
# - 每个 PR：检查 + 构建；（可选）上传预览版本
# - 推送到 main：检查 → 用预发环境变量构建 → wrangler deploy --env staging
# - 发布 tag v*：检查 → 用正式环境变量构建 → wrangler deploy
#
# 部署相关的 job 只在仓库变量 DEPLOY_ENABLED 为 "true" 时运行，Cloudflare 配好之前 CI 不会因部署失败而变红。
# 需要配置：
#   Secrets（仓库级）：CLOUDFLARE_API_TOKEN（只授予 Workers 部署权限）、CLOUDFLARE_ACCOUNT_ID
#   Variables（仓库级）：DEPLOY_ENABLED
#   Environment variables（staging / production 各一套）：
#     PUBLIC_MSAL_CLIENT_ID、PUBLIC_SITE_URL、PUBLIC_DONATE_URL_CN、PUBLIC_DONATE_URL_GLOBAL、PUBLIC_CF_ANALYTICS_TOKEN
name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx astro check
      - run: npx eslint .
      - run: npx prettier --check .
      - run: npx vitest run
      - run: npx astro build

  preview:
    # 随机预览地址无法登记为 Azure 回调地址，只能测试演示模式（SPEC 15.4）
    if: >-
      github.event_name == 'pull_request' &&
      vars.DEPLOY_ENABLED == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: check
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx astro build
        env: &public-env
          PUBLIC_MSAL_CLIENT_ID: ${{ vars.PUBLIC_MSAL_CLIENT_ID }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          PUBLIC_DONATE_URL_CN: ${{ vars.PUBLIC_DONATE_URL_CN }}
          PUBLIC_DONATE_URL_GLOBAL: ${{ vars.PUBLIC_DONATE_URL_GLOBAL }}
          PUBLIC_CF_ANALYTICS_TOKEN: ${{ vars.PUBLIC_CF_ANALYTICS_TOKEN }}
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --env staging

  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: check
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx astro build
        env: *public-env
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env staging

  deploy-production:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.DEPLOY_ENABLED == 'true'
    needs: check
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # 每个环境必须用自己的变量单独构建，不能复用预发的构建产物（SPEC 15.4）
      - run: npx astro build
        env: *public-env
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
